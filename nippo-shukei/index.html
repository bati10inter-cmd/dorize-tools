<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日報まとめ — 貼り付けて、店舗別・日別に集計する</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --line:#dfe3e8; --text:#1c2530; --muted:#6b7684;
    --accent:#2f6f4e; --accent-bg:#e8f2ec; --warn:#8a5a00; --warn-bg:#fff6e5;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
       font-size:15px;line-height:1.7}
  .wrap{max-width:1040px;margin:0 auto;padding:24px 16px 64px}
  .wrap>*{min-width:0}
  h1{font-size:22px;margin:0 0 4px}
  .lead{color:var(--muted);margin:0 0 20px;font-size:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:18px}
  h2{font-size:16px;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  textarea{width:100%;height:170px;padding:10px;border:1px solid var(--line);border-radius:6px;
           font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;resize:vertical}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
  button{font:inherit;padding:8px 14px;border-radius:6px;border:1px solid var(--line);
         background:#fff;cursor:pointer}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button:hover{filter:brightness(.97)}
  .note{background:var(--accent-bg);border-left:3px solid var(--accent);padding:10px 12px;
        border-radius:4px;font-size:13px;color:#24503a;margin-top:12px}
  .warn{background:var(--warn-bg);border-left:3px solid #d9a441;padding:10px 12px;
        border-radius:4px;font-size:13px;color:var(--warn)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{border:1px solid var(--line);padding:7px 9px;text-align:right}
  th{background:#f0f2f5;font-weight:600;text-align:center}
  td.name,th.name{text-align:left}
  tr.total td{background:#f0f2f5;font-weight:700}
  .maps{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:6px}
  .maps label{display:block;font-size:12px;color:var(--muted)}
  .maps select{width:100%;padding:6px;border:1px solid var(--line);border-radius:5px;font:inherit;font-size:13px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .kpi{border:1px solid var(--line);border-radius:8px;padding:12px}
  .kpi .k{font-size:12px;color:var(--muted)}
  .kpi .v{font-size:22px;font-weight:700;margin-top:2px}
  .bar{height:9px;background:var(--accent);border-radius:5px;min-width:2px}
  .barcell{text-align:left;width:38%}
  .err{color:#a3282a;font-size:13px;margin-top:8px}
  .hide{display:none}
  footer{color:var(--muted);font-size:12px;margin-top:28px;text-align:center}
  @media print{
    body{background:#fff}
    .noprint{display:none !important}
    .card{border:none;padding:0;margin-bottom:14px;break-inside:avoid}
    .wrap{padding:0}
  }
</style>
</head>
<body>
<div class="wrap">

  <h1>日報まとめ</h1>
  <p class="lead">店舗ごとの日報を貼り付けると、店舗別・日別に集計して、そのまま印刷やCSV書き出しができます。</p>

  <div class="card noprint">
    <h2>1. 日報を貼り付ける</h2>
    <p style="margin:0 0 8px;font-size:13px;color:var(--muted)">
      スプレッドシートやExcelから、見出し行ごとコピーして貼り付けてください（タブ区切り・カンマ区切りのどちらでも読みます）。
    </p>
    <textarea id="src" spellcheck="false" placeholder="日付	店舗	スタッフ	体験	入会	退会	売上	セッション"></textarea>
    <div class="row">
      <button class="primary" id="run">集計する</button>
      <button id="sample">サンプルを入れてみる</button>
      <button id="clear">消す</button>
    </div>
    <div class="err hide" id="err"></div>
    <div class="note">
      入力した内容は<strong>この画面の中だけで処理され、どこにも送信・保存されません</strong>。
      ページを閉じると消えます。
    </div>
  </div>

  <div class="card noprint hide" id="mapcard">
    <h2>2. 列の割り当てを確認する</h2>
    <p style="margin:0 0 4px;font-size:13px;color:var(--muted)">
      見出しから自動で判定しています。違っていればここで直してください。
    </p>
    <div class="maps" id="maps"></div>
    <div class="row"><button id="remap">この割り当てで集計し直す</button></div>
  </div>

  <div id="out"></div>

  <footer class="noprint">
    Dorize — 1画面で完結する道具。ログイン不要・データは端末の中だけで処理します。
  </footer>
</div>

<script>
(function(){
  "use strict";

  var FIELDS = [
    {key:"date",  label:"日付",     type:"dim", words:["日付","日にち","date","年月日"]},
    {key:"shop",  label:"店舗",     type:"dim", words:["店舗","店","スタジオ","shop","store"]},
    {key:"staff", label:"スタッフ", type:"dim", words:["スタッフ","担当","トレーナー","staff"]},
    {key:"trial", label:"体験",     type:"num", words:["体験","見学","カウンセリング","trial"]},
    {key:"join",  label:"入会",     type:"num", words:["入会","成約","契約","join"]},
    {key:"leave", label:"退会",     type:"num", words:["退会","解約","leave"]},
    {key:"sales", label:"売上",     type:"num", words:["売上","売り上げ","金額","sales"]},
    {key:"sess",  label:"セッション", type:"num", words:["セッション","レッスン","指導","予約","session"]}
  ];

  var el = function(id){ return document.getElementById(id); };
  var state = { head:[], rows:[], map:{} };

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }

  function splitLine(line, sep){
    // カンマ区切りのときだけ、簡易的に引用符を考慮する
    if (sep === "\t") return line.split("\t");
    var out = [], cur = "", q = false, i;
    for (i = 0; i < line.length; i++){
      var ch = line[i];
      if (q){
        if (ch === '"'){ if (line[i+1] === '"'){ cur += '"'; i++; } else { q = false; } }
        else cur += ch;
      } else {
        if (ch === '"') q = true;
        else if (ch === ",") { out.push(cur); cur = ""; }
        else cur += ch;
      }
    }
    out.push(cur);
    return out;
  }

  function parse(text){
    var lines = text.replace(/\r\n?/g, "\n").split("\n").filter(function(l){ return l.trim() !== ""; });
    if (lines.length < 2) return null;
    var sep = (lines[0].indexOf("\t") >= 0) ? "\t" : ",";
    var head = splitLine(lines[0], sep).map(function(h){ return h.trim(); });
    var rows = lines.slice(1).map(function(l){
      var c = splitLine(l, sep).map(function(v){ return v.trim(); });
      while (c.length < head.length) c.push("");
      return c;
    });
    return { head: head, rows: rows, sep: sep };
  }

  function guessMap(head){
    var map = {}, used = {};
    // 1つの列が2つの項目に割り当たらないようにする（「入会件数」が入会とセッションの
    // 両方に当たる、といった取り違えを防ぐため）
    FIELDS.forEach(function(f){
      for (var i = 0; i < head.length; i++){
        if (used[i]) continue;
        var h = head[i].toLowerCase();
        for (var w = 0; w < f.words.length; w++){
          if (h.indexOf(f.words[w].toLowerCase()) >= 0 && map[f.key] === undefined){
            map[f.key] = i; used[i] = true; break;
          }
        }
        if (map[f.key] !== undefined) break;
      }
      if (map[f.key] === undefined) map[f.key] = -1;
    });
    return map;
  }

  function num(v){
    if (v === undefined || v === null) return 0;
    var s = String(v).replace(/[,\s¥円]/g, "");
    var n = parseFloat(s);
    return isNaN(n) ? 0 : n;
  }

  function cell(row, key){
    var i = state.map[key];
    return (i === undefined || i < 0) ? "" : (row[i] === undefined ? "" : row[i]);
  }

  function fmt(n){
    return (Math.round(n * 10) / 10).toLocaleString("ja-JP");
  }

  function drawMaps(){
    var html = FIELDS.map(function(f){
      var opts = ['<option value="-1">（使わない）</option>'].concat(
        state.head.map(function(h, i){
          var sel = (state.map[f.key] === i) ? " selected" : "";
          return '<option value="' + i + '"' + sel + '>' + escapeHtml(h || ("列" + (i+1))) + '</option>';
        })
      ).join("");
      return '<div><label>' + escapeHtml(f.label) +
             (f.type === "num" ? "（数値）" : "（区分）") + '</label>' +
             '<select data-key="' + f.key + '">' + opts + '</select></div>';
    }).join("");
    el("maps").innerHTML = html;
    el("mapcard").classList.remove("hide");
  }

  function groupBy(key, metrics){
    var g = {}, order = [];
    state.rows.forEach(function(r){
      var k = cell(r, key) || "（未記入）";
      if (!g[k]){ g[k] = { n:0 }; metrics.forEach(function(m){ g[k][m] = 0; }); order.push(k); }
      g[k].n++;
      metrics.forEach(function(m){ g[k][m] += num(cell(r, m)); });
    });
    return { g: g, order: order };
  }

  function table(title, key, metrics){
    var res = groupBy(key, metrics);
    var used = metrics.filter(function(m){ return state.map[m] >= 0; });
    if (!used.length) return "";
    var head = '<tr><th class="name">' + escapeHtml(title) + '</th><th>日数</th>' +
      used.map(function(m){ return "<th>" + escapeHtml(labelOf(m)) + "</th>"; }).join("") +
      (canRate(used) ? "<th>入会率</th>" : "") + "</tr>";
    var totals = { n:0 }; used.forEach(function(m){ totals[m] = 0; });
    var body = res.order.sort().map(function(k){
      var o = res.g[k];
      totals.n += o.n;
      used.forEach(function(m){ totals[m] += o[m]; });
      return "<tr><td class=\"name\">" + escapeHtml(k) + "</td><td>" + o.n + "</td>" +
        used.map(function(m){ return "<td>" + fmt(o[m]) + "</td>"; }).join("") +
        (canRate(used) ? "<td>" + rate(o) + "</td>" : "") + "</tr>";
    }).join("");
    var foot = '<tr class="total"><td class="name">合計</td><td>' + totals.n + "</td>" +
      used.map(function(m){ return "<td>" + fmt(totals[m]) + "</td>"; }).join("") +
      (canRate(used) ? "<td>" + rate(totals) + "</td>" : "") + "</tr>";
    return '<div class="card"><h2>' + escapeHtml(title) + "別</h2>" +
           "<table>" + head + body + foot + "</table></div>";
  }

  function canRate(used){
    return used.indexOf("trial") >= 0 && used.indexOf("join") >= 0;
  }
  function rate(o){
    if (!o.trial) return "—";
    return Math.round(o.join / o.trial * 1000) / 10 + "%";
  }
  function labelOf(key){
    for (var i = 0; i < FIELDS.length; i++) if (FIELDS[i].key === key) return FIELDS[i].label;
    return key;
  }

  function kpis(){
    var metrics = ["trial","join","leave","sales","sess"];
    var sum = {}; metrics.forEach(function(m){ sum[m] = 0; });
    state.rows.forEach(function(r){ metrics.forEach(function(m){ sum[m] += num(cell(r, m)); }); });
    var items = [{k:"日報の件数", v: state.rows.length + " 件"}];
    metrics.forEach(function(m){
      if (state.map[m] >= 0) items.push({ k: labelOf(m) + "（合計）", v: fmt(sum[m]) });
    });
    if (state.map.trial >= 0 && state.map.join >= 0){
      items.push({ k:"体験→入会", v: rate({trial:sum.trial, join:sum.join}) });
    }
    if (state.map.sales >= 0 && state.map.join >= 0 && sum.join){
      items.push({ k:"入会1件あたり売上", v: fmt(sum.sales / sum.join) });
    }
    return '<div class="card"><h2>全体</h2><div class="kpis">' +
      items.map(function(i){
        return '<div class="kpi"><div class="k">' + escapeHtml(i.k) + '</div><div class="v">' +
               escapeHtml(i.v) + "</div></div>";
      }).join("") + "</div></div>";
  }

  function daily(){
    if (state.map.date < 0) return "";
    var metric = state.map.sales >= 0 ? "sales" : (state.map.sess >= 0 ? "sess" : "trial");
    if (state.map[metric] < 0) return "";
    var res = groupBy("date", [metric]);
    var keys = res.order.sort();
    var max = 0;
    keys.forEach(function(k){ if (res.g[k][metric] > max) max = res.g[k][metric]; });
    var rows = keys.map(function(k){
      var v = res.g[k][metric];
      var w = max ? Math.max(2, Math.round(v / max * 100)) : 2;
      return '<tr><td class="name">' + escapeHtml(k) + "</td><td>" + fmt(v) + "</td>" +
             '<td class="barcell"><div class="bar" style="width:' + w + '%"></div></td></tr>';
    }).join("");
    return '<div class="card"><h2>日別の' + escapeHtml(labelOf(metric)) + "</h2><table>" +
           '<tr><th class="name">日付</th><th>' + escapeHtml(labelOf(metric)) +
           '</th><th class="barcell">　</th></tr>' + rows + "</table></div>";
  }

  function csvOf(){
    var metrics = ["trial","join","leave","sales","sess"].filter(function(m){ return state.map[m] >= 0; });
    var res = groupBy("shop", metrics);
    var lines = [["店舗","日数"].concat(metrics.map(labelOf)).concat(canRate(metrics) ? ["入会率"] : []).join(",")];
    res.order.sort().forEach(function(k){
      var o = res.g[k];
      lines.push(['"' + String(k).replace(/"/g,'""') + '"', o.n]
        .concat(metrics.map(function(m){ return o[m]; }))
        .concat(canRate(metrics) ? [rate(o)] : []).join(","));
    });
    return lines.join("\r\n");
  }

  function render(){
    var html = kpis();
    html += table("店舗", "shop", ["trial","join","leave","sales","sess"]);
    if (state.map.staff >= 0) html += table("スタッフ", "staff", ["trial","join","sales","sess"]);
    html += daily();
    html += '<div class="card noprint"><div class="row">' +
            '<button class="primary" id="print">印刷する</button>' +
            '<button id="csv">店舗別集計をCSVで書き出す</button></div>' +
            '<div class="note" style="margin-top:12px">CSVは Excel で開いても文字化けしない形式（UTF-8 BOM付き）で書き出します。</div></div>';
    el("out").innerHTML = html;
    if (el("print")) el("print").onclick = function(){ window.print(); };
    if (el("csv")) el("csv").onclick = function(){
      var blob = new Blob(["﻿" + csvOf()], {type:"text/csv"});
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "nippo-shukei.csv";
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
    };
  }

  function run(){
    var p = parse(el("src").value);
    el("err").classList.add("hide");
    if (!p){
      el("err").textContent = "見出し行と、1行以上のデータが必要です。";
      el("err").classList.remove("hide");
      el("out").innerHTML = "";
      el("mapcard").classList.add("hide");
      return;
    }
    state.head = p.head;
    state.rows = p.rows;
    state.map = guessMap(p.head);
    drawMaps();
    render();
  }

  el("run").onclick = run;
  el("remap").onclick = function(){
    Array.prototype.forEach.call(el("maps").querySelectorAll("select"), function(s){
      state.map[s.getAttribute("data-key")] = parseInt(s.value, 10);
    });
    render();
  };
  el("clear").onclick = function(){
    el("src").value = ""; el("out").innerHTML = "";
    el("mapcard").classList.add("hide"); el("err").classList.add("hide");
  };
  el("sample").onclick = function(){
    el("src").value = [
      "日付\t店舗\tスタッフ\t体験\t入会\t退会\t売上\tセッション",
      "2026-09-01\t船堀店\t佐藤\t3\t1\t0\t82000\t9",
      "2026-09-01\t錦糸町店\t鈴木\t2\t1\t1\t64000\t7",
      "2026-09-02\t船堀店\t高橋\t1\t0\t0\t51000\t8",
      "2026-09-02\t錦糸町店\t鈴木\t4\t2\t0\t118000\t10",
      "2026-09-03\t船堀店\t佐藤\t2\t1\t0\t73000\t8",
      "2026-09-03\t錦糸町店\t田中\t1\t0\t1\t42000\t6",
      "2026-09-04\t船堀店\t高橋\t3\t2\t0\t96000\t11",
      "2026-09-04\t錦糸町店\t鈴木\t2\t1\t0\t70000\t8"
    ].join("\n");
    run();
  };
})();
</script>
</body>
</html>
