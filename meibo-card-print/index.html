<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>名簿カード印刷 — 名前を貼るだけでA4に面付け｜Dorize</title>
<meta name="description" content="名前のリストを貼ると、A4に指定枚数で面付けして印刷します。裁断して重ねたときに順番が通る並びにもできます。ログイン不要・入力内容は端末の中だけで処理します。">
<style>
  :root{
    --bg:#faf6ef; --panel:#fffdf9; --ink:#22201d; --muted:#6b655d;
    --line:#e2dbcf; --accent:#1b62a8; --accent-ink:#fff;
    --cell-font:14pt;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
    line-height:1.6;
  }
  header{padding:20px 20px 0;max-width:1180px;margin:0 auto}
  h1{font-size:1.25rem;margin:0 0 4px}
  .lede{margin:0;color:var(--muted);font-size:.86rem}
  .wrap{max-width:1180px;margin:0 auto;padding:16px 20px 48px;display:grid;gap:20px;grid-template-columns:minmax(300px,380px) 1fr;align-items:start}
  .wrap>*{min-width:0} /* グリッド項目が実寸のA4に押し広げられるのを防ぐ */
  @media (max-width:860px){.wrap{grid-template-columns:1fr}}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .field{margin-bottom:14px}
  .field:last-child{margin-bottom:0}
  label{display:block;font-size:.82rem;font-weight:700;margin-bottom:5px}
  .hint{font-size:.76rem;color:var(--muted);margin:4px 0 0}
  textarea{width:100%;min-height:190px;resize:vertical;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:.9rem;background:#fff}
  select,input[type=number]{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  .check{display:flex;gap:8px;align-items:flex-start;font-size:.86rem;font-weight:400;margin-bottom:9px}
  .check input{margin-top:4px}
  .check b{font-weight:700}
  button{
    width:100%;padding:12px;border:0;border-radius:9px;background:var(--accent);color:var(--accent-ink);
    font:inherit;font-weight:700;cursor:pointer
  }
  button:hover{filter:brightness(1.08)}
  .status{font-size:.82rem;color:var(--muted);margin:10px 0 0;text-align:center}
  .note{font-size:.76rem;color:var(--muted);border-top:1px solid var(--line);margin-top:16px;padding-top:12px}

  /* ---- preview ---- */
  .preview-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .preview-head h2{font-size:.92rem;margin:0}
  .preview-head span{font-size:.78rem;color:var(--muted)}
  .stage{overflow:hidden}
  .scaler{transform-origin:top left}

  .sheet{
    width:210mm;height:297mm;padding:10mm;background:#fff;
    box-shadow:0 1px 6px rgba(0,0,0,.13);margin:0 0 10mm;
    display:grid;gap:0;
  }
  .cell{
    display:flex;align-items:center;justify-content:center;text-align:center;
    padding:3mm;overflow:hidden;word-break:break-word;
    font-size:var(--cell-font);line-height:1.35;
  }
  .cell.guide{border:0.2mm dashed #b9b2a6}
  .cell.empty{color:transparent}

  @media print{
    @page{size:A4;margin:0}
    header,.panel,.preview-head,.note{display:none !important}
    body{background:#fff}
    .wrap{display:block;padding:0;margin:0;max-width:none}
    .stage{overflow:visible}
    .scaler{transform:none !important}
    .sheet{box-shadow:none;margin:0;break-after:page;page-break-after:always}
    .sheet:last-child{break-after:auto;page-break-after:auto}
  }
</style>
</head>
<body>

<header>
  <h1>名簿カード印刷</h1>
  <p class="lede">名前のリストを貼ると、A4に面付けして印刷します。裁断して重ねたときに順番が通る並びにもできます。</p>
</header>

<div class="wrap">

  <form class="panel" id="form" onsubmit="return false">
    <div class="field">
      <label for="names">名前のリスト（1行に1件）</label>
      <textarea id="names" placeholder="山田 太郎&#10;佐藤 花子&#10;鈴木 一郎"></textarea>
      <p class="hint">表計算ソフトの1列をそのままコピーして貼り付けられます。空行は無視します。</p>
    </div>

    <div class="field row">
      <div>
        <label for="layout">A4 1枚あたり</label>
        <select id="layout">
          <option value="1,2">2面（1×2）</option>
          <option value="2,2">4面（2×2）</option>
          <option value="2,3">6面（2×3）</option>
          <option value="2,4">8面（2×4）</option>
          <option value="2,5">10面（2×5）</option>
          <option value="3,4">12面（3×4）</option>
          <option value="4,5" selected>20面（4×5）</option>
          <option value="4,6">24面（4×6）</option>
        </select>
      </div>
      <div>
        <label for="fontsize">文字の大きさ</label>
        <select id="fontsize">
          <option value="9">小（9pt）</option>
          <option value="12">中（12pt）</option>
          <option value="14" selected>大（14pt）</option>
          <option value="18">特大（18pt）</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label>並び順</label>
      <label class="check">
        <input type="checkbox" id="stackorder" checked>
        <span><b>裁断して重ねた順に並べる</b><br>
        全ページを重ねて一度に裁断したとき、切り分けた山が名簿の順番どおりになります。</span>
      </label>
      <label class="check">
        <input type="checkbox" id="guides" checked>
        <span><b>裁断用の枠線を印刷する</b></span>
      </label>
      <button id="print" type="button">印刷する</button>
      <p class="status" id="status">0件 / 0枚</p>
    </div>

    <p class="note">
      入力した名前は<b>この画面の中だけで処理され、どこにも送信・保存されません</b>。
      画面を閉じると消えます。ログインも登録も要りません。<br>
      印刷ダイアログでは用紙をA4、拡大縮小を「100%（実際のサイズ）」にしてください。
    </p>
  </form>

  <section>
    <div class="preview-head">
      <h2>印刷プレビュー</h2>
      <span id="pagecount"></span>
    </div>
    <div class="stage" id="stage">
      <div class="scaler" id="scaler"></div>
    </div>
  </section>

</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var namesEl = $('names'), layoutEl = $('layout'), fontEl = $('fontsize'),
      stackEl = $('stackorder'), guideEl = $('guides'),
      scaler = $('scaler'), stage = $('stage'),
      statusEl = $('status'), pageCountEl = $('pagecount');

  function parseNames(){
    return namesEl.value.split(/\r?\n/).map(function(s){ return s.trim(); })
                  .filter(function(s){ return s.length > 0; });
  }

  // 裁断して重ねる場合、マスk・p枚目に入るのは通し番号 k*枚数+p の項目
  function orderFor(list, perSheet, sheets, stack){
    var grid = [];
    for (var p = 0; p < sheets; p++){
      var page = [];
      for (var k = 0; k < perSheet; k++){
        var idx = stack ? (k * sheets + p) : (p * perSheet + k);
        page.push(idx < list.length ? list[idx] : null);
      }
      grid.push(page);
    }
    return grid;
  }

  function render(){
    var list = parseNames();
    var parts = layoutEl.value.split(',');
    var cols = parseInt(parts[0], 10), rows = parseInt(parts[1], 10);
    var perSheet = cols * rows;
    var sheets = Math.max(1, Math.ceil(list.length / perSheet));
    var grid = orderFor(list, perSheet, sheets, stackEl.checked);

    document.documentElement.style.setProperty('--cell-font', fontEl.value + 'pt');

    var html = '';
    for (var p = 0; p < sheets; p++){
      html += '<div class="sheet" style="grid-template-columns:repeat(' + cols +
              ',1fr);grid-template-rows:repeat(' + rows + ',1fr)">';
      for (var k = 0; k < perSheet; k++){
        var v = grid[p][k];
        var cls = 'cell' + (guideEl.checked ? ' guide' : '') + (v === null ? ' empty' : '');
        html += '<div class="' + cls + '">' + (v === null ? '' : escapeHtml(v)) + '</div>';
      }
      html += '</div>';
    }
    scaler.innerHTML = html;

    statusEl.textContent = list.length + '件 / ' + (list.length ? sheets : 0) + '枚';
    pageCountEl.textContent = list.length ? 'A4 ' + sheets + '枚' : '名前を貼ると表示されます';
    fit();
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // プレビューを枠幅に合わせて縮小する（印刷時は等倍に戻る）
  function fit(){
    var sheet = scaler.querySelector('.sheet');
    if (!sheet) return;
    scaler.style.transform = 'none';
    var natural = sheet.offsetWidth;
    var avail = stage.clientWidth;
    var scale = Math.min(1, avail / natural);
    scaler.style.transform = 'scale(' + scale + ')';
    stage.style.height = (scaler.scrollHeight * scale) + 'px';
  }

  ['input','change'].forEach(function(ev){
    namesEl.addEventListener(ev, render);
  });
  [layoutEl, fontEl, stackEl, guideEl].forEach(function(el){
    el.addEventListener('change', render);
  });
  window.addEventListener('resize', fit);
  $('print').addEventListener('click', function(){ window.print(); });

  render();
})();
</script>
</body>
</html>
